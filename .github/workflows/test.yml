name: Test
# yamllint disable-line rule:truthy
on: [pull_request]
permissions:
  contents: read
jobs:
  build:
    name: Microsite Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
